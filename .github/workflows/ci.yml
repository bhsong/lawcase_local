name: CI

on:
  push:
  pull_request:

jobs:
  check:
      runs-on: ubuntu-latest
      env: 
        DEVICE: cpu 
      steps:
        - uses: actions/checkout@v5
        - uses: astral-sh/setup-uv@v6
          with:
            enable-cache: true 
        - run: uv sync --locked 
        - run: uv run ruff check
        - run: uv run ruff format --check
        - run: uv run pytest
