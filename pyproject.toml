[project]
name = "lawcase_local"
version = "0.1.0"
description = "Answer questions about a Korean law with verbatim quotes from the cited articles, using only local models"
readme = "README.md"
authors = [
    { name = "bhsong", email = "sbh3003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lawcase_local = "lawcase_local:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
